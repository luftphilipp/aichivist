2.0s step-end infinite}@keyframes f8{0%,80.00%{opacity:0}80.01%,89.99%{opacity:1}90.00%,100%{opacity:0}}@keyframes o8{0%,82.38%{opacity:0}82.39%,100%{opacity:1}}.f8{animation:f8 42.0s step-end infinite}.o8{animation:o8 42.0s step-end infinite}@keyframes f9{0%,90.00%{opacity:0}90.01%,99.99%{opacity:1}100.00%,100%{opacity:0}}@keyframes o9{0%,92.38%{opacity:0}92.39%,100%{opacity:1}}.f9{animation:f9 42.0s step-end infinite}.o9{animation:o9 42.0s step-end infinite}</style><rect width="100%" height="100%" rx="10" fill="#0d1117"/><circle cx="20" cy="17" r="6" fill="#ff5f56"/><circle cx="40" cy="17" r="6" fill="#ffbd2e"/><circle cx="60" cy="17" r="6" fill="#27c93f"/><g transform="translate(16 24)"><g class="f0"><text class="p" y="38">$ aichivist survey ~/demo/Downloads</text><g class="o0"><text class="t" y="57">~/demo/Downloads: 6 files, 412 B - disk 76.3 GB free of 460.4 GB</text><text class="t" y="76">  types: .txt 6 (412 B)</text><text class="w" y="95">  ! 4 documents with unclear names (e.g. IMG_2231.txt, invoice(1) copy.txt, invoice(1).txt)</text><text class="w" y="114">  ! program folder, keep it as it is: Example Game (Steam library)</text><text class="t" y="133">  drive health: passed (diskutil: Verified)</text><text class="t" y="152">1 duplicate file in 1 group waste 72 B (e.g. invoice(1).txt = invoice(1) copy.txt)</text><text class="t" y="171">Nothing was changed. Next: ask your agent to &quot;tidy up&quot; - it proposes a filing plan for you to approve.</text></g></g><g class="f1"><text class="p" y="38">$ aichivist suggest ~/demo/Downloads/scan_0042.txt</text><g class="o1"><text class="t" y="57">date: 2026-01-01</text><text class="t" y="76">issuer: Example Health Ltd</text><text class="t" y="95">kind: Policy</text><text class="t" y="114">summary: Example Health Ltd · Policy basic insurance · valid from 2026-01-01 · Policy holder: Alex Samp…</text><text class="t" y="133">keywords: policy, example, health, basic, insurance</text><text class="t" y="152">suggested_name: 2026-01-01 Example Health Ltd Policy basic insurance.txt</text><text class="t" y="171">has_text: True</text></g></g><g class="f2"><text class="p" y="38">$ aichivist duplicates ~/demo/Downloads --in ~/demo/archive</text><g class="o2"><text class="t" y="57">DUPLICATE  ~/demo/Downloads/invoice(1) copy.txt  ==  ~/demo/Downloads/invoice(1).txt</text></g></g><g class="f3"><text class="p" y="38">$ aichivist apps &quot;~/demo/Downloads/Example Game&quot;</text><g class="o3"><text class="t" y="57">~/demo/Downloads/Example Game: is a Steam library</text><text class="t" y="76">Before moving: adjust the program, or move with --leave-link (plan mark `link`).</text></g></g><g class="f4"><text class="p" y="38">$ aichivist plan add ~/demo/plan.md ~/demo/Downloads/scan_0042.txt &quot;~/demo/archive/Personal/Insurance/202…</text><g class="o4"><text class="t" y="57">proposed: ~/demo/Downloads/scan_0042.txt -&gt; ~/demo/archive/Personal/Insurance/2026-01-01 Example Health…</text><text class="c" y="76">$ aichivist plan add ~/demo/plan.md ~/demo/Downloads/lecture3.txt &quot;~/demo/archive/Study/01_Term/Statist…</text><text class="t" y="95">proposed: ~/demo/Downloads/lecture3.txt -&gt; ~/demo/archive/Study/01_Term/Statistics/Slides/Lecture 3 Des…</text><text class="c" y="114">$ aichivist plan add ~/demo/plan.md &quot;~/demo/Downloads/invoice(1) copy.txt&quot; TRASH --reason duplicate</text><text class="t" y="133">proposed: ~/demo/Downloads/invoice(1) copy.txt -&gt; TRASH</text></g></g><g class="f5"><text class="p" y="38">$ aichivist plan approve ~/demo/plan.md</text><g class="o5"><text class="t" y="57">3 rows approved</text></g></g><g class="f6"><text class="p" y="38">$ aichivist plan apply ~/demo/plan.md</text><g class="o6"><text class="t" y="57">3 done, 0 failed (see the plan file)</text></g></g><g class="f7"><text class="p" y="38">$ aichivist close ~/demo/archive/Study/01_Term --note &quot;all grades received&quot;</text><g class="o7"><text class="t" y="57">~/demo/archive/Study/01_Term: closed since 2026-10-23T22:02:45, 1 file</text></g></g><g class="f8"><text class="p" y="38">$ aichivist search ~/demo/archive/Study/01_Term statistics</text><g class="o8"><text class="t" y="57">Statistics/Slides/Lecture 3 Descriptive statistics.txt  …Example University · Statistics · Lecture 3: d…</text></g></g><g class="f9"><text class="p" y="38">$ aichivist storage ~/demo/storage.md --currency CHF</text><g class="o9"><text class="t" y="57">Documents: 3 copies on 3 kind(s), 1 away from home – safe (3-2-1)</text><text class="t" y="76">Photos: 2 copies on 2 kind(s), 0 away from home – at risk</text><text class="t" y="95">  - only 2 copies – add 1 more (e.g. an external drive, or a backup to the cloud)</text><text class="t" y="114">  - no copy away from home – a fire or burglary would take everything; keep one copy in the cloud or a …</text><text class="t" y="133">Cost per year: Laptop 0.00 CHF, External drive 24.00 CHF, Cloud 34.80 CHF – total 58.80 CHF</text><text class="t" y="152">Prices are the ones in your table – check current offers before deciding. Nothing was changed.</text></g></g></g></svg>
