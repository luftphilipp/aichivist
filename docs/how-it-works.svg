<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-label="How it works: the AI reads your files, proposes a plan, you approve, everything is filed and logged.">
  <style>
    .n{font:700 15px -apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#ffffff}
    .h{font:600 16px -apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#24292f}
    .p{font:13px -apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#57606a}
    .i{font:34px -apple-system,Segoe UI,Apple Color Emoji,Segoe UI Emoji,sans-serif}
  </style>
  <rect width="900" height="250" rx="16" fill="#ffffff"/>
  <g transform="translate(20 20)">
    <rect width="200" height="210" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
    <circle cx="28" cy="28" r="15" fill="#0969da"/><text class="n" x="23" y="33">1</text>
    <text class="i" x="78" y="88">🔍</text>
    <text class="h" x="20" y="130">The AI reads</text>
    <text class="p" x="20" y="154">every new document –</text>
    <text class="p" x="20" y="174">also scans and photos.</text>
  </g>
  <g transform="translate(240 20)">
    <rect width="200" height="210" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
    <circle cx="28" cy="28" r="15" fill="#0969da"/><text class="n" x="23" y="33">2</text>
    <text class="i" x="78" y="88">📋</text>
    <text class="h" x="20" y="130">It proposes a plan</text>
    <text class="p" x="20" y="154">new name, right folder,</text>
    <text class="p" x="20" y="174">duplicates to the trash.</text>
  </g>
  <g transform="translate(460 20)">
    <rect width="200" height="210" rx="14" fill="#fff8e1" stroke="#f2cc60"/>
    <circle cx="28" cy="28" r="15" fill="#bf8700"/><text class="n" x="23" y="33">3</text>
    <text class="i" x="78" y="88">✋</text>
    <text class="h" x="20" y="130">You approve</text>
    <text class="p" x="20" y="154">Nothing moves before</text>
    <text class="p" x="20" y="174">you say yes.</text>
  </g>
  <g transform="translate(680 20)">
    <rect width="200" height="210" rx="14" fill="#f3fbf5" stroke="#bfe8c9"/>
    <circle cx="28" cy="28" r="15" fill="#1a7f37"/><text class="n" x="23" y="33">4</text>
    <text class="i" x="78" y="88">🗂</text>
    <text class="h" x="20" y="130">Filed &amp; recorded</text>
    <text class="p" x="20" y="154">Catalog updated, every</text>
    <text class="p" x="20" y="174">step can be undone.</text>
  </g>
</svg>
