name: release

# Publishes to PyPI when a version tag (v0.1.0, …) is pushed.
# Needs a one-time "trusted publisher" setup on pypi.org for this repository – no token is stored here.
on:
  push:
    tags: ["v*"]

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1

  extension:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python extension/build.py dist
      - name: attach the Claude Desktop extension to the release
        # aichivist.mcpb (no version in the name) keeps the README's download button pointing at the newest release
        run: |
          cp dist/*.mcpb dist/aichivist.mcpb
          gh release upload "${GITHUB_REF_NAME}" dist/*.mcpb --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  registry:
    # Updates the MCP Registry entry (server.json) to the new release; GitHub OIDC, no secret stored.
    needs: extension
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.5
    steps:
      - uses: actions/checkout@v4
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" "$archive"
          tar xzf "$archive" mcp-publisher
      - name: point server.json at this release's extension
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          file="aichivist-${version}.mcpb"
          gh release download "${GITHUB_REF_NAME}" --pattern "$file"
          sha="$(sha256sum "$file" | cut -d' ' -f1)"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${file}"
          jq --arg v "$version" --arg u "$url" --arg s "$sha" \
            '.version = $v | .packages[0].identifier = $u | .packages[0].fileSha256 = $s' server.json > server.tmp
          mv server.tmp server.json
        env:
          GH_TOKEN: ${{ github.token }}
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
