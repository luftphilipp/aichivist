name: release

# Publishes to PyPI when a version tag (v0.1.0, …) is pushed.
# Needs a one-time "trusted publisher" setup on pypi.org for this repository – no token is stored here.
on:
  push:
    tags: ["v*"]

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1

  extension:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python extension/build.py dist
      - name: attach the Claude Desktop extension to the release
        run: gh release upload "${GITHUB_REF_NAME}" dist/*.mcpb --clobber
        env:
          GH_TOKEN: ${{ github.token }}
